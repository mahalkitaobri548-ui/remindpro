<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - RemindPro</title>
<link rel="stylesheet" href="login.css">
</head>
<body>

     <!-- CALENDAR DESIGNS -->
    <div class="calendar calendar-1">
        <span class="ring left"></span>
        <span class="ring right"></span>
    </div>

    <div class="calendar calendar-2">
        <span class="ring left"></span>
        <span class="ring right"></span>
    </div>

    <div class="calendar calendar-3">
        <span class="ring left"></span>
        <span class="ring right"></span>
    </div>

    <div class="calendar calendar-4">
        <span class="ring left"></span>
        <span class="ring right"></span>
    </div>


    <!-- LOGIN BOX -->
    <div class="login-box">


        <!-- BELL + REMINDPRO -->
        <div class="brand">

            <div class="bell">
                <div class="bell-top"></div>
                <div class="bell-body"></div>
            </div>

            <h1>RemindPro</h1>

        </div>


        <!-- LOGIN FORM -->
        <form action="login.php" method="POST">

            <input
                type="email"
                name="email"
                class="input-box"
                placeholder="Email"
                autocomplete="email"
                required>

            <input
                type="password"
                name="password"
                class="input-box"
                placeholder="Password"
                autocomplete="current-password"
                required>

            <button type="submit" class="login-btn">
                Log In
            </button>

        </form>


        <!-- SIGN UP -->
        <div class="signup-text">
            Don't have an account?
            <a href="signup.html">
                Sign Up
            </a>
        </div>
        
    </div>
    
</body>
</html>
